name: Publish verified delivery attachments
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-delivery.yml']
permissions:
  contents: write
concurrency:
  group: publish-delivery-20261031
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Transfer SHA-pinned approved public assets and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_URL: https://about-zinc-crown-textile.trycloudflare.com
          MANIFEST_SHA256: 7c4761f3bbebf1b27b52242759cbda191f6653feeeaff6a1a4b414bb46bc1fc1
        shell: bash
        run: |
          python3 - <<'PYTHON'
          """Run by the repository's GitHub Actions job; publish only SHA-pinned bytes."""
          import os,json,hashlib,urllib.request,urllib.parse,subprocess,time
          from pathlib import Path
          BASE=os.environ['TRANSFER_URL'].rstrip('/')
          REPO='Sean-xzx/Smolvlm-Compression-Study'
          TAG='autonomous-20261031-release'
          COMMIT='c8c31283aa066f5a0dc9036e7b9d56e93bde1386'
          PIN=os.environ['MANIFEST_SHA256']
          assert os.environ['GITHUB_REPOSITORY']==REPO
          root=Path('release-payload');root.mkdir(exist_ok=True)
          def download(name,sha=None,size=None):
           assert Path(name).name==name and '\\' not in name
           target=root/name
           for attempt in range(3):
            try:
             h=hashlib.sha256();n=0
             req=urllib.request.Request(BASE+'/'+urllib.parse.quote(name,safe=''),headers={'User-Agent':'Sean-xzx-release-transfer'})
             with urllib.request.urlopen(req,timeout=180) as r,target.open('wb') as f:
              while chunk:=r.read(2**20):f.write(chunk);h.update(chunk);n+=len(chunk)
             if sha is not None:assert h.hexdigest()==sha,(name,h.hexdigest(),sha)
             if size is not None:assert n==size,(name,n,size)
             print('Downloaded and SHA checked',name,n,h.hexdigest(),flush=True);return target
            except Exception:
             if attempt==2:raise
             time.sleep(5)
          manifest=download('ASSETS.json',PIN);m=json.loads(manifest.read_text());assert m['commit']==COMMIT and m['tag']==TAG
          assets=[]
          for row in m['assets']:assets.append(download(row['name'],row['sha256'],row['bytes']))
          sums=download('SHA256SUMS.txt');notes=download('RELEASE_NOTES.zh.md')
          expected=''.join(row['sha256']+'  '+row['name']+'\n' for row in m['assets']);assert sums.read_text()==expected
          base=['gh','--repo',REPO]
          # Release is created only after every payload was downloaded and SHA checked.
          existing=subprocess.run(base+['release','view',TAG,'--json','assets,url'],capture_output=True,text=True)
          if existing.returncode==0:
           remote=json.loads(existing.stdout);got={a['name']:a for a in remote['assets']}
           wanted=[*m['assets'],{'name':'ASSETS.json','bytes':manifest.stat().st_size,'sha256':PIN},{'name':'SHA256SUMS.txt','bytes':sums.stat().st_size,'sha256':hashlib.sha256(sums.read_bytes()).hexdigest()}]
           missing=[]
           for row in wanted:
            if row['name'] in got:
             a=got[row['name']];assert a['size']==row['bytes'];assert a.get('digest')=='sha256:'+row['sha256'],row['name']
            else:missing.append(str(root/row['name']))
           if missing:subprocess.run(base+['release','upload',TAG,*missing],check=True)
          else:
           subprocess.run(base+['release','create',TAG,'--target',COMMIT,'--title','Smolvlm-Compression-Study · 报告与完整复现证据','--notes-file',str(notes),*[str(p) for p in assets],str(manifest),str(sums)],check=True)
          print('Release upload command finished; public download verification is separate.',flush=True)
          PYTHON
